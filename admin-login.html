<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administrador - Iniciar sesión</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body>


    <main class="login">

        <div class="login-box">


            <h1>
                ADMINISTRADOR
            </h1>


            <!-- =========================
                 CORREO
            ========================== -->

            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
                autocomplete="email"
            >


            <!-- =========================
                 CONTRASEÑA
            ========================== -->

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                autocomplete="current-password"
            >


            <!-- =========================
                 INGRESAR
            ========================== -->

            <button
                type="button"
                onclick="iniciarSesion()"
            >

                INGRESAR

            </button>


            <!-- =========================
                 MENSAJE
            ========================== -->

            <p id="mensaje"></p>


            <!-- =========================
                 VOLVER
            ========================== -->

            <button
                type="button"
                class="volver"
                onclick="window.location.href='index.html'"
            >

                VOLVER A LA TIENDA

            </button>


        </div>

    </main>



    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         TU SCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
