<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mi Tienda</title>

<link rel="stylesheet"
      href="estilos.css">

<style>

/* =====================================================
   VENTANA OFERTAS
===================================================== */

#ventanaOfertas {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.30);
    z-index: 9999;
}

.encabezado-ofertas {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.encabezado-ofertas h2 {
    margin: 0;
    font-size: 20px;
}

#cerrarOfertas {
    border: none;
    background: #dc2626;
    color: white;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-weight: bold;
}

#fondoOfertas {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 9998;
}


/* =====================================================
   PRODUCTOS
===================================================== */

.contenido-cliente {
    padding-top: 4px;
}


/* =====================================================
   PRODUCTOS EN OFERTA
===================================================== */

.producto-oferta {
    position: relative;
}


/* =====================================================
   PARTE INFERIOR DEL PRODUCTO
===================================================== */

.producto-parte-inferior {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    box-sizing: border-box;
}


/* =====================================================
   ETIQUETA OFERTA
===================================================== */

.etiqueta-oferta {
    position: static;
    display: inline-flex;
    align-items: center;
    justify-content: center;

    background: #f97316;
    color: white;

    padding: 7px 10px;

    border-radius: 5px;

    font-size: 11px;
    font-weight: bold;

    box-shadow: 0 2px 5px rgba(0,0,0,0.20);

    white-space: nowrap;

    z-index: 2;

    flex-shrink: 0;
}


/* =====================================================
   BOTÓN PEDIR
===================================================== */

.producto-parte-inferior .btn-pedir {
    flex: 1;
    margin: 0 !important;
}


/* =====================================================
   TARJETAS DE OFERTAS
===================================================== */

.lista-ofertas-contenedor {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

.tarjeta-oferta {
    position: relative;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    padding-bottom: 10px;
}

.tarjeta-oferta img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    display: block;
    background: #fff;
}

.tarjeta-oferta-info {
    padding: 10px;
}

.tarjeta-oferta-info h3 {
    margin: 0 0 7px;
    font-size: 16px;
}

.tarjeta-oferta-precio {
    margin: 5px 0;
    font-size: 18px;
    font-weight: bold;
    color: #ea580c;
}

.tarjeta-oferta-dato {
    margin: 4px 0;
    font-size: 13px;
    color: #555;
}

.tarjeta-oferta .btn-pedir {
    width: calc(100% - 20px);
    margin: 8px 10px 0;
}


/* =====================================================
   CORAZÓN
===================================================== */

#btnCalificar {
    cursor: pointer;
    transition: transform 0.15s ease;
}

#btnCalificar.corazon-latiendo {
    animation: latidoCorazon 0.45s ease;
}

@keyframes latidoCorazon {

    0% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.45);
    }

    55% {
        transform: scale(1.15);
    }

    75% {
        transform: scale(1.35);
    }

    100% {
        transform: scale(1);
    }

}


/* =====================================================
   RULETA
===================================================== */

#fondoRuleta {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.70);
    z-index: 19998;
}

#ventanaRuletaCliente {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 94%;
    max-width: 560px;
    max-height: 94vh;
    overflow-y: auto;
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.40);
    z-index: 19999;
    text-align: center;
    margin: 0;
}

.encabezado-ruleta-cliente {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.encabezado-ruleta-cliente h2 {
    margin: 0;
    font-size: 22px;
    color: #222;
}

#btnCerrarRuletaCliente {
    border: none;
    background: #dc2626;
    color: white;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.texto-ruleta {
    margin: 5px 0 15px;
    font-size: 14px;
    color: #555;
}

.contenedor-ruleta-circular {
    position: relative;
    width: min(86vw, 420px);
    height: min(86vw, 420px);
    max-width: 420px;
    max-height: 420px;
    margin: 10px auto 20px;
}

#canvasRuleta {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    transform: rotate(0deg);
    transition:
        transform 5s cubic-bezier(0.12,0.72,0.12,1);
    box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.puntero-ruleta {
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 35px solid #dc2626;
    z-index: 10;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.30));
}

.centro-ruleta {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    background: white;
    border: 7px solid #ff7a00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    z-index: 5;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);
}

#btnGirarRuleta {
    width: 90%;
    max-width: 350px;
    border: none;
    border-radius: 10px;
    padding: 13px;
    background: #16a34a;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.20);
}

#btnGirarRuleta:hover {
    background: #12823b;
    transform: scale(1.03);
}

#btnGirarRuleta:disabled {
    background: #999;
    cursor: not-allowed;
    transform: none;
}

#resultadoRuleta {
    min-height: 30px;
    margin-top: 15px;
    padding: 10px;
    border-radius: 10px;
    background: #f3f4f6;
    font-size: 15px;
    font-weight: bold;
    color: #222;
}

#detallePremioRuleta {
    display: none;
    margin-top: 12px;
    padding: 15px;
    border-radius: 12px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
}

#detallePremioRuleta h3 {
    margin: 0 0 7px;
    color: #ea580c;
}

#detallePremioRuleta p {
    margin: 5px 0;
    font-size: 14px;
}

#imagenPremioResultado {
    display: none;
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin: 10px auto;
    border-radius: 12px;
    border: 2px solid #ff7a00;
    background: white;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width:500px) {

    #ventanaRuletaCliente {
        width: 96%;
        padding: 15px;
        border-radius: 16px;
    }

    .encabezado-ruleta-cliente h2 {
        font-size: 19px;
    }

    .texto-ruleta {
        font-size: 13px;
    }

    .centro-ruleta {
        width: 58px;
        height: 58px;
        border-width: 6px;
        font-size: 21px;
    }

    .puntero-ruleta {
        border-left-width: 15px;
        border-right-width: 15px;
        border-top-width: 30px;
    }

    #imagenPremioResultado {
        width: 120px;
        height: 120px;
    }

    .lista-ofertas-contenedor {
        grid-template-columns: 1fr;
    }

    .tarjeta-oferta img {
        height: 240px;
    }

    .producto-parte-inferior {
        gap: 6px;
    }

    .etiqueta-oferta {
        padding: 6px 8px;
        font-size: 10px;
    }

}

</style>

</head>


<body>

<footer class="pie-cliente">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   CONEXIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://yuivmqncvmsbtiigxsqt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r1ZMaIIEVcAt26_P-FBu9Q_DUenqDH_";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   DATOS WHATSAPP
===================================================== */

let numeroWhatsApp = "";

let mensajeWhatsAppGuardado = "";


/* =====================================================
   IR AL ADMIN
===================================================== */

function irAlAdmin() {

    window.location.href =
        "admin-login.html";

}


/* =====================================================
   CORAZÓN
===================================================== */

function calificarTienda() {

    const corazon =
        document.getElementById("btnCalificar");

    if (!corazon) {
        return;
    }

    corazon.classList.remove("corazon-latiendo");

    void corazon.offsetWidth;

    corazon.classList.add("corazon-latiendo");

    alert(
        "Gracias por calificar nuestra tienda ❤️"
    );

    setTimeout(function() {

        corazon.classList.remove(
            "corazon-latiendo"
        );

    }, 500);

}


/* =====================================================
   OBTENER OFERTAS DESDE SUPABASE
===================================================== */

async function obtenerOfertasSupabase() {

    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("ofertas")

            .select("*")

            .eq("activo", true)

            .order(
                "creado_en",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Error cargando ofertas desde Supabase:",
                error
            );

            return [];

        }


        return Array.isArray(data)
            ? data
            : [];

    }

    catch(error) {

        console.error(
            "Error inesperado cargando ofertas:",
            error
        );

        return [];

    }

}


/* =====================================================
   ABRIR OFERTAS
===================================================== */

async function abrirOfertas() {

    const ventana =
        document.getElementById(
            "ventanaOfertas"
        );

    const fondo =
        document.getElementById(
            "fondoOfertas"
        );


    if (ventana) {

        ventana.style.display =
            "block";

    }


    if (fondo) {

        fondo.style.display =
            "block";

    }


    await cargarOfertas();

}


/* =====================================================
   CERRAR OFERTAS
===================================================== */

function cerrarOfertas() {

    const ventana =
        document.getElementById(
            "ventanaOfertas"
        );

    const fondo =
        document.getElementById(
            "fondoOfertas"
        );


    if (ventana) {

        ventana.style.display =
            "none";

    }


    if (fondo) {

        fondo.style.display =
            "none";

    }

}


/* =====================================================
   CARGAR OFERTAS EN VENTANA
===================================================== */

async function cargarOfertas() {

    const lista =
        document.getElementById(
            "listaOfertas"
        );


    if (!lista) {
        return;
    }


    lista.innerHTML = `

        <p style="text-align:center;">
            Cargando ofertas...
        </p>

    `;


    const ofertas =
        await obtenerOfertasSupabase();


    lista.innerHTML = "";


    if (
        !Array.isArray(ofertas) ||
        ofertas.length === 0
    ) {

        lista.innerHTML = `

            <div class="sin-ofertas">

                <p>
                    Actualmente no hay productos en oferta.
                </p>

            </div>

        `;

        return;

    }


    const contenedor =
        document.createElement(
            "div"
        );


    contenedor.className =
        "lista-ofertas-contenedor";


    ofertas.forEach(
        function(oferta) {

            const tarjeta =
                document.createElement(
                    "div"
                );


            tarjeta.className =
                "tarjeta-oferta";


            const etiqueta =
                document.createElement(
                    "div"
                );


            etiqueta.className =
                "etiqueta-oferta";


            etiqueta.textContent =
                "OFERTA";


            const imagen =
                document.createElement(
                    "img"
                );


            imagen.src =
                oferta.imagen || "";


            imagen.alt =
                oferta.nombre ||
                "Oferta";


            const informacion =
                document.createElement(
                    "div"
                );


            informacion.className =
                "tarjeta-oferta-info";


            const nombre =
                document.createElement(
                    "h3"
                );


            nombre.textContent =
                oferta.nombre ||
                "Producto";


            const precio =
                document.createElement(
                    "p"
                );


            precio.className =
                "tarjeta-oferta-precio";


            precio.textContent =
                "S/ " +
                Number(
                    oferta.precio || 0
                ).toFixed(2);


            const color =
                document.createElement(
                    "p"
                );


            color.className =
                "tarjeta-oferta-dato";


            color.textContent =
                "Color: " +
                (
                    oferta.color ||
                    "-"
                );


            const talla =
                document.createElement(
                    "p"
                );


            talla.className =
                "tarjeta-oferta-dato";


            talla.textContent =
                "Talla: " +
                (
                    oferta.talla ||
                    "-"
                );


            const pedir =
                document.createElement(
                    "button"
                );


            pedir.className =
                "btn-pedir";


            pedir.type =
                "button";


            pedir.textContent =
                "PEDIR";


            pedir.addEventListener(
                "click",
                function() {

                    crearPedidoWhatsApp(
                        oferta
                    );

                }
            );


            informacion.appendChild(
                nombre
            );

            informacion.appendChild(
                precio
            );

            informacion.appendChild(
                color
            );

            informacion.appendChild(
                talla
            );


            tarjeta.appendChild(
                etiqueta
            );

            tarjeta.appendChild(
                imagen
            );

            tarjeta.appendChild(
                informacion
            );

            tarjeta.appendChild(
                pedir
            );


            contenedor.appendChild(
                tarjeta
            );

        }
    );


    lista.appendChild(
        contenedor
    );

}


/* =====================================================
   OBTENER FECHA
===================================================== */

function obtenerFechaProducto(producto) {

    if (!producto) {
        return 0;
    }


    const posiblesFechas = [

        producto.creado_en,

        producto.creadoEn,

        producto.fecha_creacion,

        producto.fechaCreacion,

        producto.fecha_publicacion,

        producto.fechaPublicacion,

        producto.created_at,

        producto.createdAt

    ];


    for (
        let i = 0;
        i < posiblesFechas.length;
        i++
    ) {

        if (
            posiblesFechas[i] !== undefined &&
            posiblesFechas[i] !== null &&
            posiblesFechas[i] !== ""
        ) {

            const fecha =
                new Date(
                    posiblesFechas[i]
                ).getTime();


            if (!isNaN(fecha)) {

                return fecha;

            }

        }

    }


    return 0;

}


/* =====================================================
   PREPARAR WHATSAPP
===================================================== */

function prepararNumeroWhatsApp(numero) {

    if (!numero) {
        return "";
    }


    numero =
        String(numero).trim();


    numero =
        numero.replace(
            /\D/g,
            ""
        );


    if (
        numero.startsWith("51")
    ) {

        return numero;

    }


    if (
        numero.length === 9
    ) {

        return "51" + numero;

    }


    return numero;

}


/* =====================================================
   CONFIGURACIÓN
===================================================== */

async function cargarConfiguracionCliente() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from(
                    "configuracion_tienda"
                )

                .select("*")

                .limit(1)

                .maybeSingle();


        if (error) {

            console.error(
                "Error cargando configuración:",
                error
            );

            return;

        }


        if (!data) {
            return;
        }


        const whatsapp =
            data.whatsapp ||
            data.whatsapp_numero ||
            data.numero_whatsapp ||
            data.telefono_whatsapp ||
            data.telefono ||
            data.celular ||
            data.numero ||
            "";


        numeroWhatsApp =
            prepararNumeroWhatsApp(
                whatsapp
            );


        mensajeWhatsAppGuardado =
            data.whatsapp_mensaje ||
            data.mensaje_whatsapp ||
            data.mensaje ||
            data.mensajeWhatsApp ||
            data.texto_whatsapp ||
            data.textoWhatsApp ||
            "";


        const titulo =
            data.titulo_cliente ||
            data.tituloCliente ||
            data.titulo_cliente_tienda ||
            data.titulo ||
            null;


        if (titulo) {

            const elemento =
                document.getElementById(
                    "tituloCliente"
                );


            if (elemento) {

                elemento.textContent =
                    titulo;

            }

        }


        const eslogan =
            data.eslogan_cliente ||
            data.esloganCliente ||
            data.slogan_cliente ||
            data.eslogan ||
            data.slogan ||
            null;


        if (eslogan) {

            const elemento =
                document.getElementById(
                    "esloganCliente"
                );


            if (elemento) {

                elemento.textContent =
                    eslogan;

            }

        }


        const pie =
            data.pie_cliente ||
            data.pieCliente ||
            data.footer_cliente ||
            data.footer ||
            null;


        if (pie) {

            const elemento =
                document.getElementById(
                    "pieCliente"
                );


            if (elemento) {

                elemento.textContent =
                    pie;

            }

        }


        const color =
            data.color_cliente ||
            data.colorCliente ||
            data.color_tienda ||
            data.color ||
            null;


        if (color) {

            aplicarColorCliente(
                color
            );

        }


        const tipografiaTitulo =
            data.tipografia_titulo_cliente ||
            data.tipografiaTituloCliente ||
            data.tipografia_titulo ||
            data.tipografia_cliente_titulo ||
            null;


        if (tipografiaTitulo) {

            const elemento =
                document.getElementById(
                    "tituloCliente"
                );

async function cargarProductosCliente() {

                .eq(
                    "activo",

                )

                .order(
                    "creado_en",
                    {
                        ascending: false
                    }
                );


        if (ofertasError) {

            console.error(
                "Error cargando ofertas:",
                ofertasError
            );

        }


        /* =================================================
           PRODUCTOS NORMALES
        ================================================= */

        const productosNormales =
            Array.isArray(
                productosData
            )
                ? productosData.map(
                    function(producto) {

                        return {

                            ...producto,

                            esOferta: false

                        };

                    }
                )
                : [];


        /* =================================================
           OFERTAS
        ================================================= */

        const productosOferta =
            Array.isArray(
                ofertasData
            )
                ? ofertasData.map(
                    function(oferta) {

                        return {

                            ...oferta,

                            esOferta: true

                        };

                    }
                )
                : [];


        /* =================================================
           UNIR PRODUCTOS + OFERTAS
        ================================================= */

        const todosLosProductos = [

            ...productosNormales,

            ...productosOferta

        ];


        /* =================================================
           ORDENAR POR FECHA
        ================================================= */

        todosLosProductos.sort(
            function(a, b) {

                const fechaA =
                    obtenerFechaProducto(a);


                const fechaB =
                    obtenerFechaProducto(b);


                return fechaB -
                       fechaA;

            }
        );


        contenedor.innerHTML =
            "";


        /* =================================================
           NO HAY PRODUCTOS
        ================================================= */

        if (
            todosLosProductos.length === 0
        ) {

            contenedor.innerHTML = `

                <p class="mensaje-vacio">
                    Todavía no hay productos publicados.
                </p>

            `;

            return;

        }


        /* =================================================
           MOSTRAR TODO
        ================================================= */

        todosLosProductos.forEach(
            function(producto) {

                crearTarjetaProducto(
                    producto,
                    producto.esOferta === true,
                    contenedor
                );

            }
        );

    }


    catch(error) {

        console.error(
            "Error inesperado:",
            error
        );


        contenedor.innerHTML = `

            <p class="mensaje-error">
                Error al conectar con la tienda.
            </p>

        `;

    }

/* =====================================================
   CARGAR RULETA SUPABASE
===================================================== */

async function cargarConfiguracionRuletaCliente() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient

                .from(
                    "configuracion_ruleta"
                )

                .select(
                    "id, activa, premios, actualizado_en"
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                )

                .limit(1)

                .maybeSingle();


        if (error) {

            console.error(
                "Error cargando ruleta:",
                error
            );

            return false;

        }


        if (!data) {

            ruletaActivaCliente =
                false;

            return false;

        }


        ruletaActivaCliente =
            data.activa === true;


        if (
            Array.isArray(
                data.premios
            )
        ) {

            premiosRuleta =
                data.premios
                    .slice(0,4)
                    .map(
                        function(
                            premio,
                            indice
                        ) {

                            return {

                                numero:
                                    premio.numero ||
                                    indice + 1,

                                tipo:
                                    premio.tipo ===
                                    "imagen"
                                        ? "imagen"
                                        : "texto",

                                nombre:
                                    premio.nombre ||
                                    premio.texto ||
                                    "PREMIO " +
                                    (indice + 1),

                                texto:
                                    premio.texto ||
                                    premio.nombre ||
                                    "PREMIO " +
                                    (indice + 1),

                                imagen:
                                    premio.imagen ||
                                    "",

                                modo:
                                    premio.modo ||
                                    "cantidad",

                                cantidad:
                                    Number(
                                        premio.cantidad
                                    ) || 1,

                                descripcion:
                                    premio.descripcion ||
                                    ""

                            };

                        }
                    );

        }


        while (
            premiosRuleta.length < 4
        ) {

            const numero =
                premiosRuleta.length + 1;


            premiosRuleta.push({

                numero:
                    numero,

                tipo:
                    "texto",

                nombre:
                    "PREMIO " +
                    numero,

                texto:
                    "PREMIO " +
                    numero,

                imagen:
                    "",

                modo:
                    "cantidad",

                cantidad:
                    1,

                descripcion:
                    ""

            });

        }


        return true;

    }


    catch(error) {

        console.error(
            "Error inesperado ruleta:",
            error
        );

        return false;

    }

}

function obtenerNombrePremio(
    premio,

    );

/* =====================================================
   IMAGEN RULETA
===================================================== */

function cargarImagenRuleta(src) {

    return new Promise(
        function(resolve) {

            if (!src) {

                resolve(null);

                return;

            }


            const imagen =
                new Image();


            imagen.onload =
                function() {

                    resolve(
                        imagen
                    );

                };


            imagen.onerror =
                function() {

                    resolve(null);

                };


            imagen.src =
                src;

        }
    );

}


/* =====================================================
   DIBUJAR RULETA
===================================================== */

async function dibujarRuleta() {

    const canvas =
        document.getElementById(
            "canvasRuleta"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    const centroX =
        canvas.width / 2;


    const centroY =
        canvas.height / 2;


    const radio =
        285;


    const cantidad =
        4;


    const angulo =
        (Math.PI * 2) /
        cantidad;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const colores = [

        "#ff7a00",
        "#2563eb",
        "#16a34a",
        "#dc2626"

    ];


    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        const inicio =
            -Math.PI / 2 +
            i * angulo;


        const fin =
            inicio +
            angulo;


        const premio =
            premiosRuleta[i] || {

                numero:
                    i + 1,

                tipo:
                    "texto",

                nombre:
                    "PREMIO " +
                    (i + 1),

                texto:
                    "PREMIO " +
                    (i + 1),

                imagen:
                    ""

            };


        ctx.beginPath();


        ctx.moveTo(
            centroX,
            centroY
        );


        ctx.arc(
            centroX,
            centroY,
            radio,
            inicio,
            fin
        );


        ctx.closePath();


        ctx.fillStyle =
            colores[
                i % colores.length
            ];


        ctx.fill();


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth =
            7;


        ctx.stroke();


        const anguloCentro =
            inicio +
            angulo / 2;


        const contenidoX =
            centroX +
            Math.cos(
                anguloCentro
            ) * 175;


        const contenidoY =
            centroY +
            Math.sin(
                anguloCentro
            ) * 175;


        let texto =
            obtenerNombrePremio(
                premio,
                i + 1
            );


        if (
            texto.length > 20
        ) {

            texto =
                texto.substring(
                    0,
                    20
                ) + "...";

        }


        ctx.save();


        ctx.translate(
            contenidoX,
            contenidoY
        );


        ctx.rotate(
            anguloCentro
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "bold 21px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillText(
            texto,
            0,
            0
        );


        ctx.restore();

    }


    ctx.beginPath();


    ctx.arc(
        centroX,
        centroY,
        radio,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        "#222";


    ctx.lineWidth =
        8;


    ctx.stroke();

}

/* =====================================================
   GIRAR RULETA
===================================================== */

function girarRuletaCliente() {

    if (ruletaGirando) {
        return;
    }


    if (!ruletaActivaCliente) {
        return;
    }


    const canvas =
        document.getElementById(
            "canvasRuleta"
        );


    const boton =
        document.getElementById(
            "btnGirarRuleta"
        );


    const resultado =
        document.getElementById(
            "resultadoRuleta"
        );


    const detalle =
        document.getElementById(
            "detallePremioRuleta"
        );


    const nombreResultado =
        document.getElementById(
            "nombrePremioResultado"
        );


    const descripcionResultado =
        document.getElementById(
            "descripcionPremioResultado"
        );


    const imagenResultado =
        document.getElementById(
            "imagenPremioResultado"
        );


    if (!canvas) {
        return;
    }


    ruletaGirando =
        true;


    if (boton) {

        boton.disabled =
            true;

        boton.textContent =
            "🎡 GIRANDO...";

    }


    if (detalle) {

        detalle.style.display =
            "none";

    }


    const cantidad =
        premiosRuleta.length;


    const premioGanador =
        Math.floor(
            Math.random() *
            cantidad
        );


    const gradosPorPremio =
        360 /
        cantidad;


    const centroPremio =
        premioGanador *
        gradosPorPremio +
        gradosPorPremio / 2;


    const actual =
        (
            (
                rotacionRuleta %
                360
            ) + 360
        ) % 360;


    let ajuste =
        360 -
        centroPremio -
        actual;


    if (ajuste < 0) {

        ajuste += 360;

    }


    const vueltas =
        5 +
        Math.floor(
            Math.random() * 3
        );


    rotacionRuleta +=
        vueltas * 360 +
        ajuste;


    canvas.style.transform =
        "rotate(" +
        rotacionRuleta +
        "deg)";


    setTimeout(
        function() {

            ruletaGirando =
                false;


            const premio =
                premiosRuleta[
                    premioGanador
                ];


            const nombre =
                obtenerNombrePremio(
                    premio,
                    premioGanador + 1
                );


            const texto =
                premio &&
                premio.texto
                    ? premio.texto
                    : nombre;


            premioGanadoRuleta =
                nombre;


            try {

                sessionStorage.setItem(
                    "premioGanadoRuleta",
                    nombre
                );

            }
            catch(error) {}


            if (resultado) {

                resultado.textContent =
                    "🎉 ¡GANASTE: " +
                    nombre +
                    "!";

            }


            if (nombreResultado) {

                nombreResultado.textContent =
                    "🎁 " +
                    nombre;

            }


            if (descripcionResultado) {

                descripcionResultado.textContent =
                    premio &&
                    premio.descripcion
                        ? premio.descripcion
                        : texto;

            }


            if (
                imagenResultado &&
                premio &&
                premio.tipo === "imagen" &&
                premio.imagen
            ) {

                imagenResultado.onload =
                    function() {

                        imagenResultado.style.display =
                            "block";

                    };


                imagenResultado.onerror =
                    function() {

                        imagenResultado.style.display =
                            "none";

                    };


                imagenResultado.src =
                    premio.imagen;

            }
            else if (imagenResultado) {

                imagenResultado.style.display =
                    "none";

                imagenResultado.removeAttribute(
                    "src"
                );

            }


            if (detalle) {

                detalle.style.display =
                    "block";

            }


            setTimeout(
                function() {

                    cerrarRuletaCliente();

                },
                3000
            );

        },
        5200
    );

}


/* =====================================================
   COMPROBAR RULETA
===================================================== */

async function comprobarEstadoRuleta() {

    const cargada =
        await cargarConfiguracionRuletaCliente();


    if (!cargada) {

        cerrarRuletaCliente();

        return;

    }


    if (ruletaActivaCliente) {

        await abrirRuletaCliente();

    }
    else {

        cerrarRuletaCliente();

    }

}


/* =====================================================
   ACTUALIZAR RULETA
===================================================== */

let intervaloRuletaSupabase =
    null;


function iniciarActualizacionRuleta() {

    if (intervaloRuletaSupabase) {

        clearInterval(
            intervaloRuletaSupabase
        );

    }


    intervaloRuletaSupabase =
        setInterval(
            async function() {

                try {

                    const estadoAnterior =
                        ruletaActivaCliente;


                    const cargada =
                        await cargarConfiguracionRuletaCliente();


                    if (!cargada) {
                        return;
                    }


                    if (
                        estadoAnterior !==
                        ruletaActivaCliente
                    ) {

                        if (
                            ruletaActivaCliente
                        ) {

                            await abrirRuletaCliente();

                        }
                        else {

                            cerrarRuletaCliente();

                        }

                    }

                    else if (
                        ruletaActivaCliente &&
                        !ruletaGirando
                    ) {

                        const ventana =
                            document.getElementById(
                                "ventanaRuletaCliente"
                            );


                        if (
                            ventana &&
                            ventana.style.display ===
                            "block"
                        ) {

                            await dibujarRuleta();

                        }

                    }

                }

                catch(error) {

                    console.error(
                        "Error actualizando ruleta:",
                        error
                    );

                }

            },
            5000
        );

}


/* =====================================================
   ACTUALIZAR OFERTAS AUTOMÁTICAMENTE
   DESDE SUPABASE
===================================================== */

let intervaloOfertasSupabase =
    null;


function iniciarActualizacionOfertas() {

    if (intervaloOfertasSupabase) {

        clearInterval(
            intervaloOfertasSupabase
        );

    }


    intervaloOfertasSupabase =
        setInterval(
            async function() {

                try {

                    await cargarProductosCliente();


                    const ventana =
                        document.getElementById(
                            "ventanaOfertas"
                        );


                    if (
                        ventana &&
                        ventana.style.display ===
                        "block"
                    ) {

                        await cargarOfertas();

                    }

                }

                catch(error) {

                    console.error(
                        "Error actualizando ofertas:",
                        error
                    );

                }

            },
            10000
        );

}


/* =====================================================
   INICIAR TIENDA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await cargarConfiguracionCliente();

        await cargarProductosCliente();

        await comprobarEstadoRuleta();

        iniciarActualizacionRuleta();

        iniciarActualizacionOfertas();

    }
);

</script>
